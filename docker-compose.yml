# Zależności lokalne: `docker compose up -d` startuje postgres i mailpit.
# Backend działa z IDE, frontend z Vite. Kolejne profile (full, web, async, p1) dochodzą z etapami.
name: przychodnia360

services:
  postgres:
    image: postgres:16.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw w .env (skopiuj .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      P360_DB_NAME: ${P360_DB_NAME:-p360}
      P360_OWNER_PASSWORD: ${P360_OWNER_PASSWORD:?ustaw w .env (skopiuj .env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${P360_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Profil full: cała platforma w kontenerach (osoby bez Javy, e2e). Domyślnie backend działa z IDE.
  backend:
    profiles: ["full"]
    build:
      context: ./backend
      target: runtime
    environment:
      SPRING_PROFILES_ACTIVE: local
      # W sieci compose baza i poczta mają nazwy usług (z IDE: localhost)
      DB_URL: jdbc:postgresql://postgres:5432/${P360_DB_NAME:-p360}
      P360_OWNER_PASSWORD: ${P360_OWNER_PASSWORD:?ustaw w .env (skopiuj .env.example)}
      P360_APP_PASSWORD: ${P360_APP_PASSWORD:?ustaw w .env (skopiuj .env.example)}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    # Punkt wyjścia zbliżony do zadania Fargate (0,5 vCPU, 2 GB); finalnie z ADR-006
    cpus: 0.5
    mem_limit: 2g
    # Bez restart: błędy backendu mają być widoczne

  # Profil edge: krawędź (Traefik, fala 1.5) przed backendem; reguły z docker/edge (generowane do
  # docker/traefik/dynamic/routes.yml). Uruchom razem z full: `docker compose --profile full --profile edge up -d`.
  traefik:
    profiles: ["edge"]
    image: traefik:v3.2.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EDGE_PORT:-8090}:80"
    volumes:
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Profil async (osobny od full: e2e go nie potrzebuje, a obraz ma ok. 2 GB): SNS i SQS lokalnie (LocalStack,
  # fala 1.4). Temat, kolejki i DLQ tworzy docker/localstack/init (skrypt musi mieć bit wykonywalności w git).
  # Wersja przypięta (community, bez tokenu); `latest` wymaga konta. Backend włącza transport zmiennymi
  # P360_EVENTS_SNS_TOPIC_ARN i P360_EVENTS_AWS_ENDPOINT (patrz README).
  localstack:
    profiles: ["async"]
    image: localstack/localstack:3.8.1
    restart: unless-stopped
    environment:
      SERVICES: sns,sqs
      AWS_DEFAULT_REGION: eu-central-1
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./docker/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sns list-topics | grep -q p360-clinic-core-events"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  pgdata:
