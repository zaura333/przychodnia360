# Zależności lokalne: `docker compose up -d` startuje postgres i mailpit (backend z IDE, frontend z Vite).
#
# Profile (zadanie 1.10), łączone flagą --profile:
#   core    rdzeń: usługi biznesowe (dziś monolit clinic-core jako "backend") i krawędź Traefik. To zestaw dla e2e
#           i dla osób bez Javy: `docker compose --profile core up -d --build --wait`.
#   finance zarezerwowany dla billing i integration-hub (fala 2 i 3); na razie bez usług.
#   edge    sama krawędź (Traefik), gdy backend działa z IDE.
#   async   SNS i SQS lokalnie (LocalStack, obraz ok. 2 GB), nie wchodzi do core, żeby e2e go nie pobierało.
#   full    wszystko: core + finance + async.
# Nowa usługa dostaje wpis w profilu core (lub finance), bazę z P360_SERVICE_DATABASES (docker/postgres/init) i
# upstream w docker/edge/upstreams.csv.
name: przychodnia360

services:
  postgres:
    image: postgres:16.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw w .env (skopiuj .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      P360_DB_NAME: ${P360_DB_NAME:-p360}
      P360_OWNER_PASSWORD: ${P360_OWNER_PASSWORD:?ustaw w .env (skopiuj .env.example)}
      # Baza per usługa (zadanie 1.10): lista nazw usług, np. "notification,integration-hub"; hasła właścicieli
      # P360_<NAZWA>_OWNER_PASSWORD trafiają do kontenera z .env (env_file poniżej). Puste = tylko baza główna.
      P360_SERVICE_DATABASES: ${P360_SERVICE_DATABASES:-catalog,patient}
      P360_CATALOG_OWNER_PASSWORD: ${P360_CATALOG_OWNER_PASSWORD:-p360_catalog_owner_local_dev}
      P360_PATIENT_OWNER_PASSWORD: ${P360_PATIENT_OWNER_PASSWORD:-p360_patient_owner_local_dev}
    env_file:
      - .env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${P360_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Usługa clinic-core (monolit; docelowo iam, patient, catalog, scheduling). Profile core i full; domyślnie backend
  # działa z IDE. Limit 0,5 vCPU i 2 GB jak zadanie Fargate: start trwa dłużej niż na laptopie, stąd tolerancyjny
  # healthcheck w Dockerfile (M-7).
  backend:
    profiles: ["core", "full"]
    build:
      context: ./backend
      target: runtime
    environment:
      SPRING_PROFILES_ACTIVE: local
      # W sieci compose baza i poczta mają nazwy usług (z IDE: localhost)
      DB_URL: jdbc:postgresql://postgres:5432/${P360_DB_NAME:-p360}
      P360_OWNER_PASSWORD: ${P360_OWNER_PASSWORD:?ustaw w .env (skopiuj .env.example)}
      P360_APP_PASSWORD: ${P360_APP_PASSWORD:?ustaw w .env (skopiuj .env.example)}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      # Katalog wydzielony (S1, ADR-M14): fasada katalogu woła catalog-service przez REST, a seed zakłada katalog
      # przez jego API. Odwrócenie: P360_CATALOG_MODE=local i upstream `catalog` w docker/edge/upstreams.csv na backend.
      P360_CATALOG_MODE: remote
      P360_CATALOG_URL: http://catalog:8080
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      # seed przy starcie zakłada katalog w catalog-service, więc ta usługa musi już działać
      catalog:
        condition: service_healthy
    # Punkt wyjścia zbliżony do zadania Fargate (0,5 vCPU, 2 GB); finalnie z ADR-006
    cpus: 0.5
    mem_limit: 2g
    # Bez restart: błędy backendu mają być widoczne

  # catalog-service (S1, ADR-M14): własna baza p360_catalog i własne role; tokeny weryfikuje z JWKS clinic-core.
  # Krawędź kieruje do niej /services/**, /service-categories i /admin/service*/** (docker/edge/upstreams.csv).
  catalog:
    profiles: ["core", "full"]
    build:
      context: ./backend
      target: runtime
      args:
        MODULE: services/catalog
        JAR: catalog
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/p360_catalog
      P360_CATALOG_OWNER_PASSWORD: ${P360_CATALOG_OWNER_PASSWORD:-p360_catalog_owner_local_dev}
      P360_CATALOG_APP_PASSWORD: ${P360_CATALOG_APP_PASSWORD:-p360_catalog_app_local_dev}
      # JWKS wystawcy tokenów (iam, dziś clinic-core); usługa nie ma żadnego sekretu podpisu
      P360_JWKS_URL: http://backend:8080/api/v1/auth/jwks
    ports:
      - "127.0.0.1:${CATALOG_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 1g

  # patient-service (S2): własna baza p360_patient i własne role; tokeny weryfikuje z JWKS clinic-core. Routing krawędzi
  # nadal kieruje /me/patient i /reception/patients/** do backendu (przełączenie po zdalnej fasadzie i sadze rejestracji).
  patient:
    profiles: ["core", "full"]
    build:
      context: ./backend
      target: runtime
      args:
        MODULE: services/patient
        JAR: patient
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/p360_patient
      P360_PATIENT_OWNER_PASSWORD: ${P360_PATIENT_OWNER_PASSWORD:-p360_patient_owner_local_dev}
      P360_PATIENT_APP_PASSWORD: ${P360_PATIENT_APP_PASSWORD:-p360_patient_app_local_dev}
      P360_JWKS_URL: http://backend:8080/api/v1/auth/jwks
    ports:
      - "127.0.0.1:${PATIENT_PORT:-8083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 1g

  # Krawędź (Traefik, fala 1.5) przed backendem; reguły z docker/edge (generowane do docker/traefik/dynamic/routes.yml).
  # Wchodzi do core i full; profil edge uruchamia ją samą (np. przy backendzie z IDE).
  traefik:
    profiles: ["core", "full", "edge"]
    image: traefik:v3.2.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EDGE_PORT:-8090}:80"
    volumes:
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Profil async (poza core: e2e go nie potrzebuje, a obraz ma ok. 2 GB; wchodzi do full): SNS i SQS lokalnie (LocalStack,
  # fala 1.4). Temat, kolejki i DLQ tworzy docker/localstack/init (skrypt musi mieć bit wykonywalności w git).
  # Wersja przypięta (community, bez tokenu); `latest` wymaga konta. Backend włącza transport zmiennymi
  # P360_EVENTS_SNS_TOPIC_ARN i P360_EVENTS_AWS_ENDPOINT (patrz README).
  localstack:
    profiles: ["async", "full"]
    image: localstack/localstack:3.8.1
    restart: unless-stopped
    environment:
      SERVICES: sns,sqs
      AWS_DEFAULT_REGION: eu-central-1
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./docker/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sns list-topics | grep -q p360-clinic-core-events"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  pgdata:
