name: setup-frontend
description: Node (wersja z frontend/.nvmrc), cache npm i npm ci. Wykrywa, czy szkielet frontendu już istnieje.

outputs:
  present:
    description: "'true', gdy istnieją frontend/package.json i frontend/package-lock.json"
    value: ${{ steps.detect.outputs.present }}

runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      run: |
        cd "$GITHUB_WORKSPACE"
        if [ -f frontend/package.json ] && [ -f frontend/package-lock.json ] && [ -f frontend/.nvmrc ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Brak frontend/package.json, package-lock.json lub .nvmrc (szkielet frontendu jeszcze nie istnieje), kroki budowania pominięte."
        fi
    - if: steps.detect.outputs.present == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: frontend/.nvmrc
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - if: steps.detect.outputs.present == 'true'
      shell: bash
      working-directory: frontend
      run: npm ci
