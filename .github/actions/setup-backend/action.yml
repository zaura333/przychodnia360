name: setup-backend
description: Java (Temurin, wersja z .java-version) i cache Mavena.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version-file: .java-version
        cache: maven
        cache-dependency-path: |
          backend/**/pom.xml
          backend/.mvn/wrapper/maven-wrapper.properties
    # setup-java cache: maven obejmuje tylko ~/.m2/repository; sam Maven pobierany przez mvnw leży w ~/.m2/wrapper.
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.m2/wrapper
        key: mvnw-${{ runner.os }}-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}
