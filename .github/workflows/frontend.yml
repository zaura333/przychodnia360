name: frontend

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    # paths-filter na PR pobiera listę plików z API GitHuba (wymaga pull-requests: read)
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'api/**'
              - '.github/actions/setup-frontend/**'
              - '.github/workflows/frontend.yml'

  build-test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - name: Generowanie klienta API
        run: npm run api:generate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Testy jednostkowe
        env:
          TZ: America/Los_Angeles
        run: npm test
      - name: Build
        run: npm run build
      # Budżet rozmiaru + brak statycznych importów obszarów (manifest Vite)
      - name: Budżet paczek
        run: npm run check:bundle
      - name: Wersja Playwright
        id: pw
        run: echo "version=$(npx --no-install playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache przeglądarek Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Instalacja Chromium
        run: npx playwright install --with-deps chromium
      # Smoke przeciwko `vite preview` (etap 0, bez backendu): test CSP, trasy, baner
      - name: Playwright e2e
        run: npm run test:e2e
      - name: Audyt zależności produkcyjnych
        run: npm audit --omit=dev --audit-level=high
      - name: Raporty i ślady Playwright
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-playwright
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Paczka dist (tylko main)
        if: github.ref == 'refs/heads/main'
        run: tar -czf "$GITHUB_WORKSPACE/frontend-${GITHUB_SHA}.tgz" -C dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main'
        with:
          name: frontend-dist
          path: frontend-${{ github.sha }}.tgz
          if-no-files-found: error
          retention-days: 30

  # Wdrożenie (S3, unieważnienie CloudFront, OIDC) jest wyłączone; włączane w 1a (F14 / CD3.3)
  # po powstaniu infrastruktury. Wymaga zatwierdzenia w Environment demo.
  deploy:
    if: false
    needs: build-test
    runs-on: ubuntu-24.04
    environment: demo
    steps:
      - run: echo 'Wdrozenie frontendu - patrz plan CI/CD, zadanie CD3.3'

  # Wymagany status. Zawsze raportuje: zielony także wtedy, gdy zadania pominięto zgodnie z filtrem.
  frontend:
    needs: [changes, build-test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Agregacja wyników
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Wyniki: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::Co najmniej jedno zadanie zakończyło się wynikiem: $r"
              exit 1
            fi
          done
