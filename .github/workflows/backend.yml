name: backend

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OASDIFF_VERSION: "1.37.0"
  OSV_SCANNER_VERSION: "2.7.1"

# Macierz usług (zadanie 1.9). Plan wylicza .github/scripts/backend_matrix.py z listy zmienionych plików:
# zmiana tylko w backend/services/<usługa> buduje tylko tę usługę, zmiana w platform/*, wspólnych plikach
# budowania, kontraktach (api/), dockerze lub w tym pliku buduje wszystkie usługi i testy platformy.
# Na pushu do main i develop budowane jest wszystko. Nowa usługa (katalog z pom.xml w backend/services) trafia do
# macierzy sama, bez zmian w tym pliku.
jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.plan.outputs.run }}
      platform: ${{ steps.plan.outputs.platform }}
      services: ${{ steps.plan.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Testy skryptu planu
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only "origin/${BASE_REF}...HEAD" | python3 .github/scripts/backend_matrix.py >> "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/backend_matrix.py --all < /dev/null >> "$GITHUB_OUTPUT"
          fi
          echo "Plan:"
          cat "$GITHUB_OUTPUT"

  # Biblioteki platform/* (shared-core, starter, test-support): testy raz, poza macierzą usług (zadania usług
  # pomijają je właściwością p360.platform.skipTests). W test-support są też bramki kontraktów zdarzeń i OpenAPI.
  platform:
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
      - name: Maven verify (platform)
        working-directory: backend
        run: ./mvnw -B verify -pl platform/p360-shared-core,platform/p360-platform-starter,platform/p360-test-support
      - name: Raporty testów
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports-platform
          path: backend/platform/**/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  build-test:
    name: build-test (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.services != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
      # verify usługi z zależnościami z reaktora (-am); testy platform/* biegną w zadaniu "platform".
      # Testy: jednostkowe, Testcontainers, ArchUnit, RLS, role, macierz uprawnień, kontrakty.
      # Faza testów generuje api/openapi.json (OpenApiExportTest).
      - name: Maven verify (${{ matrix.service }})
        working-directory: backend
        run: ./mvnw -B verify -pl services/${{ matrix.service }} -am -Dp360.platform.skipTests=true
      - name: Kontrakty api/ zgodne z kodem
        run: |
          if ! git diff --exit-code -- api/; then
            echo "::error::Pliki w api/ różnią się od wygenerowanych z kodu. Uruchom './mvnw verify' w backend/ i zatwierdź zmianę."
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard -- api/)" ]; then
            echo "::error::W api/ powstał plik, który nie jest zatwierdzony w repozytorium."
            exit 1
          fi
      - name: Raporty testów
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports-${{ matrix.service }}
          path: |
            backend/services/${{ matrix.service }}/target/surefire-reports/
            backend/services/${{ matrix.service }}/target/failsafe-reports/
            backend/services/${{ matrix.service }}/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  # Blokada (fala 0, A3): złamanie kontraktu względem bazy PR daje czerwony wynik.
  # Sprawdzany jest kontrakt zagregowany; pliki per usługa (api/services) są z niego wyprowadzane.
  openapi-breaking:
    needs: changes
    if: needs.changes.outputs.backend == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: oasdiff breaking względem bazy PR
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ ! -f api/openapi.json ]; then
            echo "::notice::Brak api/openapi.json w PR, pomijam."
            exit 0
          fi
          if ! git cat-file -e "origin/${BASE_REF}:api/openapi.json" 2>/dev/null; then
            echo "::notice::Brak api/openapi.json w gałęzi bazowej (pierwszy kontrakt), pomijam."
            exit 0
          fi
          git show "origin/${BASE_REF}:api/openapi.json" > "$RUNNER_TEMP/base-openapi.json"
          curl -sSfL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" oasdiff
          "$RUNNER_TEMP/oasdiff" breaking "$RUNNER_TEMP/base-openapi.json" api/openapi.json --format githubactions --fail-on ERR
      # Kontrakty wewnętrzne usług (api/internal/<usługa>.json, ścieżki /api/v1/internal/**) są poza agregatem, ale
      # wołają je inne usługi, więc ich złamanie też blokuje PR. Nowy plik (brak w bazie) nie jest złamaniem.
      - name: oasdiff breaking kontraktów wewnętrznych względem bazy PR
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ ! -x "$RUNNER_TEMP/oasdiff" ]; then
            curl -sSfL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
              | tar -xz -C "$RUNNER_TEMP" oasdiff
          fi
          status=0
          for file in api/internal/*.json; do
            [ -f "$file" ] || continue
            if ! git cat-file -e "origin/${BASE_REF}:${file}" 2>/dev/null; then
              echo "::notice::Brak ${file} w gałęzi bazowej (pierwszy kontrakt), pomijam."
              continue
            fi
            git show "origin/${BASE_REF}:${file}" > "$RUNNER_TEMP/base-internal.json"
            "$RUNNER_TEMP/oasdiff" breaking "$RUNNER_TEMP/base-internal.json" "$file" --format githubactions --fail-on ERR || status=1
          done
          exit $status

  # Blokada (zadanie 1.8): zmiana schematu zdarzenia łamiąca istniejących konsumentów (usunięte lub zmienione pole,
  # pole wymagane staje się opcjonalne, obniżona wersja, usunięty typ zdarzenia) daje czerwony wynik. Zamiast edycji
  # w miejscu: nowy typ zdarzenia (api/events/README.md). Test: EventSchemaBreakingChangeTest.
  events-breaking:
    needs: changes
    if: needs.changes.outputs.backend == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-backend
      - name: Zmiany łamiące kontrakty zdarzeń względem bazy PR
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$(git ls-tree -r --name-only "origin/${BASE_REF}" -- api/events)" ]; then
            echo "::notice::Brak api/events w gałęzi bazowej (pierwsze schematy), pomijam."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/base-events"
          git archive "origin/${BASE_REF}" api/events | tar -x -C "$RUNNER_TEMP/base-events"
          cd backend
          ./mvnw -B -q -pl platform/p360-test-support -am test \
            -Dtest=EventSchemaBreakingChangeTest -Dsurefire.failIfNoSpecifiedTests=false \
            -Dp360.events.base-dir="$RUNNER_TEMP/base-events/api/events"

  security:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
      # osv-scanner nie rozwiązuje zależności od modułów z reaktora (p360-shared-core, p360-platform-starter), więc skanujemy SBOM
      # wygenerowany przez Mavena (pełne drzewo zależności, także przechodnie).
      - name: SBOM zależności Mavena
        working-directory: backend
        run: ./mvnw -B -q org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom -DskipTests
      - name: osv-scanner (SBOM)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source -L backend/target/bom.json

  # Jar Spring Boot + obraz Dockera z celu from-jar (DK2) dla każdej usługi z macierzy, także na PR: e2e.yml
  # uruchamia ten sam jar, z którego powstaje obraz wdrożeniowy (ECS Fargate). Konwencja: usługa services/<nazwa>
  # ma artefakt <nazwa> (jar <nazwa>.jar) i obraz p360/<nazwa>. Push do ECR (rola gha-ecr-push, OIDC) tylko na main
  # i dopiero po powstaniu infrastruktury (CD2.3); do tego czasu zadanie push-image jest wyłączone.
  package:
    name: package (${{ matrix.service }})
    needs: [changes, build-test]
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.services != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
      - name: Build jar i SBOM
        working-directory: backend
        run: |
          ./mvnw -B -q -pl services/${{ matrix.service }} -am package -DskipTests
          ./mvnw -B -q org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom -DskipTests
          cp services/${{ matrix.service }}/target/${{ matrix.service }}.jar app.jar
          cp target/bom.json "$GITHUB_WORKSPACE/${{ matrix.service }}-${GITHUB_SHA}.sbom.json" 2>/dev/null \
            || echo "::warning::Brak target/bom.json (SBOM nie powstał)."
      - name: Obraz Docker (cel from-jar, x86_64)
        working-directory: backend
        run: docker build --target from-jar -t "p360/${{ matrix.service }}:${GITHUB_SHA}" .
      - name: Skan obrazu (trivy, blokada przy HIGH i CRITICAL z poprawką)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: p360/${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-package-${{ matrix.service }}
          path: |
            backend/app.jar
            ${{ matrix.service }}-${{ github.sha }}.sbom.json
          if-no-files-found: error
          retention-days: 14

  push-image:
    if: false # włączane w CD2.3 (ECR, rola gha-ecr-push) po powstaniu infrastruktury
    needs: package
    runs-on: ubuntu-24.04
    environment: demo
    steps:
      - run: echo 'Push obrazu do ECR - patrz plan CI/CD, zadanie CD2.3'

  # Wymagany status. Zawsze raportuje: zielony także wtedy, gdy zadania pominięto zgodnie z planem.
  # Wynik zadania z macierzą jest zbiorczy (porażka dowolnej usługi daje porażkę całości).
  backend:
    needs: [changes, platform, build-test, openapi-breaking, events-breaking, security, package]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Agregacja wyników
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Wyniki: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::Co najmniej jedno zadanie zakończyło się wynikiem: $r"
              exit 1
            fi
          done
