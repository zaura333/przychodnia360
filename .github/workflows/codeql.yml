name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            glob: "*.java"
            build-mode: none
          - language: javascript-typescript
            glob: "*.ts"
            build-mode: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # CodeQL kończy się błędem, gdy nie widzi kodu źródłowego; do czasu powstania szkieletów pomijamy.
      - id: src
        run: |
          if [ -n "$(git ls-files "${{ matrix.glob }}" "**/${{ matrix.glob }}" | head -n 1)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Brak plików ${{ matrix.glob }}, analiza ${{ matrix.language }} pominięta."
          fi
      - if: steps.src.outputs.present == 'true'
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: steps.src.outputs.present == 'true'
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          category: /language:${{ matrix.language }}
