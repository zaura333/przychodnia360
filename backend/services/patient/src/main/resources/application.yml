# patient-service (S2). Bez sekretów: hasła wyłącznie ze zmiennych środowiskowych (lokalnie wartości dev w
# application-local.yml). Usługa nie ma kluczy podpisu: tokeny weryfikuje kluczami publicznymi z JWKS (iam).
spring:
  application:
    name: patient
  datasource:
    # Aplikacja łączy się wyłącznie jako p360_app (bez BYPASSRLS, bez prawa tworzenia obiektów)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/p360_patient}
    username: p360_patient_app
    password: ${P360_PATIENT_APP_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 0
      connection-timeout: 3000
  flyway:
    # Migracje jako właściciel schematu (p360_owner), osobne poświadczenia niż aplikacja
    url: ${FLYWAY_URL:${DB_URL:jdbc:postgresql://localhost:5432/p360}}
    user: p360_patient_owner
    password: ${P360_PATIENT_OWNER_PASSWORD}
    placeholders:
      app_password: ${P360_PATIENT_APP_PASSWORD}
      app_role: p360_patient_app
      owner_role: p360_patient_owner
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  # Nie ujawniamy komunikatów błędów ani śladów stosu w odpowiedzi
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  tracing:
    # Mały ruch demo: próbkujemy wszystko; traceId trafia do logów (MDC) i do zdarzeń (outbox, koperta)
    sampling:
      probability: 1.0
    export:
      otlp:
        # Eksport śladów do collectora OTLP włącza flaga; domyślnie wyłączony (brak collectora, bez błędów w logach)
        enabled: ${P360_OTLP_TRACES_ENABLED:false}
  otlp:
    tracing:
      export:
        enabled: ${P360_OTLP_TRACES_ENABLED:false}
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

p360:
  events:
    relay:
      # Przekaźnik outboxu (fala 1.3); bez brokera zdarzenia są tylko logowane (LoggingEventTransport)
      enabled: true
      interval: PT1S
      batch-size: 50

security:
  jwt:
    issuer: przychodnia360
    # JWKS wystawcy tokenów (clinic-core/iam); bez adresu usługa odrzuca każde żądanie z tokenem
    jwks-url: ${P360_JWKS_URL:}
    jwks-timeout-millis: 2000

springdoc:
  api-docs:
    path: /api/v1/docs/json
  swagger-ui:
    path: /api/v1/docs
  # Deterministyczny plik kontraktu (api/openapi.json jest zatwierdzany w repozytorium)
  writer-with-default-pretty-printer: true
  writer-with-order-by-keys: true
