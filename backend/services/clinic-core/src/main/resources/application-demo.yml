# Profil demo (ECS Fargate). Poświadczenia z Parameter Store/Secrets dochodzą w zadaniach CD2.x; tu tylko zachowanie.
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

logging:
  structured:
    format:
      console: logstash
    json:
      customizer: pl.przychodnia360.common.logging.PeselMaskingCustomizer

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

security:
  jwt:
    active-kid: ${JWT_ACTIVE_KID}
    # JWT_ACTIVE_KEY: klucz prywatny RSA (PKCS#8, Base64) z Parameter Store; klucze wycofywane po rotacji
    # dochodzą jako kolejne wpisy z samym public-key (X.509, Base64)
    keys:
      "[${JWT_ACTIVE_KID}]":
        private-key: ${JWT_ACTIVE_KEY}

seed:
  password: ${SEED_PASSWORD:}   # pusty = seed pominięty; hasło z Parameter Store
