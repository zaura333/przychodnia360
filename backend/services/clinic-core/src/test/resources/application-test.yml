# Profil testowy: baza z Testcontainers (adresy i hasła ustawia AbstractIntegrationTest).
spring:
  flyway:
    # migracja testowa tworzy tabelę wzorcową _tenant_probe (nie istnieje w produkcji)
    locations: classpath:db/migration,classpath:db/testmigration

logging:
  structured:
    format:
      console: logstash
    json:
      # nazwa usługi w każdym wpisie (korelacja logów wielu usług)
      add:
        service: ${spring.application.name}
      customizer: pl.przychodnia360.common.logging.PeselMaskingCustomizer

p360:
  # usługi uprawnione do tokenów usługowych iam (ADR-M17); sekret syntetyczny, tylko w testach
  service-clients:
    scheduling:
      secret: test-scheduling-client-secret
      audiences: [iam, catalog, patient]
  events:
    relay:
      # w testach przekaźnik uruchamiają testy (OutboxRelay.runOnce), nie harmonogram
      enabled: false

security:
  jwt:
    generate-ephemeral-key: true
  password:
    argon2:
      # obniżone parametry tylko w testach (ADR-B06), żeby nie wydłużać builda
      memory-kib: 1024
      iterations: 1
      parallelism: 1
