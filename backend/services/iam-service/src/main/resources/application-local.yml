# Profil lokalny (docker-compose). Wartości dev są jawne, bo dane są syntetyczne i lokalne;
# zgodne z .env.example. Nadpisywane zmiennymi środowiskowymi (np. w profilu compose `full`).
spring:
  datasource:
    password: ${P360_APP_PASSWORD:p360_app_local_dev}
  flyway:
    password: ${P360_OWNER_PASSWORD:p360_owner_local_dev}
    placeholders:
      app_password: ${P360_APP_PASSWORD:p360_app_local_dev}

  mail:
    host: localhost   # Mailpit z docker-compose (w profilu full nadpisywane SPRING_MAIL_HOST)
    port: 1025

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

security:
  # Lokalnie i w e2e każde wejście na stronę odświeża sesję, więc limit z profilu domyślnego (20/min) jest za niski
  rate-limit:
    per-minute: 300
  # Vite dev (5173), nginx (8081) i vite preview używany w e2e (4173)
  allowed-origins: http://localhost:5173,http://localhost:8081,http://localhost:4173
  jwt:
    active-kid: local-1
    keys:
      local-1: bG9jYWwtZGV2LW9ubHktand0LWtleS0wMTIzNDU2Nzg5YWJjZGVm

app:
  public-base-url: http://localhost:5173

seed:
  # Hasło wszystkich kont demo (dane syntetyczne, tylko lokalnie); nadpisz zmienną SEED_PASSWORD
  password: ${SEED_PASSWORD:demo-przychodnia-2026}

server:
  # Z IDE każda usługa ma własny port; w compose wszystkie słuchają na 8080 za krawędzią (Traefik)
  port: ${SERVER_PORT:8091}

p360:
  internal:
    # Współdzielony nagłówek wewnętrznego API (ADR-M07); tylko lokalnie, w compose i demo ze zmiennej środowiskowej
    token: ${P360_INTERNAL_TOKEN:local-dev-internal-token}
