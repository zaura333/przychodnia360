# Profil lokalny (docker-compose). Wartości dev są jawne, bo dane są syntetyczne i lokalne;
# zgodne z .env.example. Nadpisywane zmiennymi środowiskowymi (np. w profilu compose `full`).
spring:
  datasource:
    password: ${P360_IAM_APP_PASSWORD:p360_iam_app_local_dev}
  flyway:
    password: ${P360_IAM_OWNER_PASSWORD:p360_iam_owner_local_dev}
    placeholders:
      app_password: ${P360_IAM_APP_PASSWORD:p360_iam_app_local_dev}

  mail:
    host: localhost   # Mailpit z docker-compose (w profilach compose core i full nadpisywane SPRING_MAIL_HOST)
    port: 1025

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

security:
  # Lokalnie i w e2e każde wejście na stronę odświeża sesję, więc limit z profilu domyślnego (20/min) jest za niski
  rate-limit:
    per-minute: 300
  # Vite dev (5173), nginx (8081) i vite preview używany w e2e (4173)
  allowed-origins: http://localhost:5173,http://localhost:8081,http://localhost:4173
  jwt:
    # Lokalnie klucz RS256 jest generowany przy starcie (brak kluczy prywatnych w repozytorium);
    # po restarcie access tokeny tracą ważność, sesję odtwarza token odświeżania
    generate-ephemeral-key: true

app:
  public-base-url: http://localhost:5173

seed:
  # Hasło wszystkich kont demo (dane syntetyczne, tylko lokalnie); nadpisz zmienną SEED_PASSWORD
  password: ${SEED_PASSWORD:demo-przychodnia-2026}

p360:
  service-clients:
    scheduling:
      # sekret dev usługi scheduling (dane syntetyczne, tylko lokalnie); w compose P360_SCHEDULING_CLIENT_SECRET
      secret: ${P360_SCHEDULING_CLIENT_SECRET:p360_scheduling_client_local_dev}
