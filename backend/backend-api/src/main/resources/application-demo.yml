# Profil demo (AWS). Poświadczenia z Parameter Store dochodzą w zadaniach CD2.x; tu tylko zachowanie.
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:2}

logging:
  structured:
    format:
      console: logstash
    json:
      customizer: pl.przychodnia360.common.logging.PeselMaskingCustomizer

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
